<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof Desk — Pratik Bairoliya</title>
<meta name="description" content="An interactive desk of proofs and derivations that unravel line by line, over a field of formulas that reacts to your cursor.">
<style>
  :root{
    --bg:#08090c; --ink:#e8eaf0; --dim:#767b8a; --line:#1c1f28;
    --accent:#7fb2ff; --accent2:#f5c76a; --panel:#0d0f14;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 var(--mono);overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #field{position:fixed;inset:0;z-index:0;display:block}

  .layout{
    position:relative;z-index:1;height:100%;
    display:grid;grid-template-columns:262px 1fr;gap:26px;
    padding:26px;max-width:1180px;margin:0 auto;
  }

  /* ---- window-chrome menu ---- */
  .win{
    display:flex;flex-direction:column;min-height:0;
    background:rgba(13,15,20,.82);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .bar{
    display:flex;align-items:center;gap:8px;padding:9px 12px;
    background:linear-gradient(#171a22,#12151c);border-bottom:1px solid var(--line);
    cursor:default;user-select:none;
  }
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .bar .t{margin-left:6px;font-size:11.5px;color:var(--dim);letter-spacing:.04em}
  .win-body{padding:10px;overflow-y:auto;min-height:0;flex:1}
  .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#4d525f;
       padding:12px 8px 6px}
  .item{
    display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;
    background:none;border:0;color:var(--dim);font:13px/1.45 var(--mono);
    padding:7px 9px;border-radius:6px;cursor:pointer;transition:background .13s,color .13s;
  }
  .item .n{font-size:10.5px;color:#414653;flex:0 0 18px}
  .item:hover{background:#141821;color:var(--ink)}
  .item[aria-current="true"]{background:#152033;color:var(--accent)}
  .item[aria-current="true"] .n{color:var(--accent)}
  .win-foot{border-top:1px solid var(--line);padding:9px 14px;font-size:11px;color:#414653;
            display:flex;justify-content:space-between;gap:10px}
  .win-foot a{color:#5a6070;text-decoration:none}
  .win-foot a:hover{color:var(--accent)}

  /* ---- stage ---- */
  .stage{overflow-y:auto;min-height:0;padding:6px 8px 40px}
  .kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#4d525f;margin:0 0 8px}
  h1{font:400 30px/1.25 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
  .ask{color:var(--dim);max-width:60ch;margin:0 0 26px;font-size:13.5px}
  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .step{
    counter-increment:s;position:relative;padding:14px 0 14px 46px;
    border-top:1px solid var(--line);
    opacity:0;transform:translateY(9px);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1);
  }
  .step::before{
    content:counter(s);position:absolute;left:0;top:15px;
    width:26px;height:26px;border:1px solid var(--line);border-radius:6px;
    display:grid;place-items:center;font-size:10.5px;color:#4d525f;
  }
  .step.in{opacity:1;transform:none}
  .step.in::before{border-color:#2a3040;color:var(--accent)}
  .math{font:400 19px/1.75 var(--serif);letter-spacing:.01em;color:var(--ink)}
  .why{font-size:12.5px;color:var(--dim);margin-top:5px}
  .step:last-child .math{color:var(--accent2)}
  .qed{display:inline-block;margin-left:8px;color:var(--accent2)}

  .frac{display:inline-flex;flex-direction:column;vertical-align:-0.55em;
        text-align:center;margin:0 .22em;line-height:1.15}
  .frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .3em}
  .frac>span:last-child{padding:0 .3em}

  .replay{margin-top:26px;background:none;border:1px solid var(--line);color:var(--dim);
          font:11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;
          padding:9px 15px;border-radius:7px;cursor:pointer;transition:.15s}
  .replay:hover{border-color:var(--accent);color:var(--accent)}

  @media (max-width:820px){
    body{overflow:auto}
    .layout{grid-template-columns:1fr;height:auto;gap:18px;padding:16px}
    .win{max-height:none}
    .win-body{max-height:216px}
  }
  @media (prefers-reduced-motion:reduce){
    .step{transition:none;opacity:1;transform:none}
  }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<div class="layout">

  <aside class="win">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="t">proofs — desk</span>
    </div>
    <div class="win-body">
      <p class="grp">Identities</p>
      <div id="menu-identities"></div>
      <p class="grp">Analysis</p>
      <div id="menu-analysis"></div>
      <p class="grp">Discrete &amp; probability</p>
      <div id="menu-discrete"></div>
    </div>
    <div class="win-foot">
      <a href="index.html">← back</a>
      <span id="counter">—</span>
    </div>
  </aside>

  <main class="stage" id="stage">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="ask" id="ask"></p>
    <ol class="steps" id="steps"></ol>
    <button class="replay" id="replay">unravel again</button>
  </main>

</div>

<script>
(() => {
  "use strict";
  const F = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;

  const PROOFS = [
    { g:"identities", k:"Identity", t:"Euler's identity",
      ask:"Why should e, i, π, 1 and 0 have anything to do with each other?",
      steps:[
        ["e<sup>x</sup> = 1 + x + " + F("x²","2!") + " + " + F("x³","3!") + " + ⋯",
         "Start from the series that <em>defines</em> the exponential."],
        ["e<sup>iθ</sup> = 1 + iθ − " + F("θ²","2!") + " − i" + F("θ³","3!") + " + " + F("θ⁴","4!") + " + ⋯",
         "Substitute x = iθ. Powers of i cycle i, −1, −i, 1."],
        ["= (1 − " + F("θ²","2!") + " + " + F("θ⁴","4!") + " − ⋯) + i(θ − " + F("θ³","3!") + " + ⋯)",
         "Split into the terms with an i and the terms without."],
        ["e<sup>iθ</sup> = cos θ + i sin θ",
         "Those two brackets are exactly the series for cosine and sine."],
        ["e<sup>iπ</sup> = −1 &nbsp;⟹&nbsp; e<sup>iπ</sup> + 1 = 0 <span class='qed'>∎</span>",
         "Set θ = π. Five constants, one equation, no room to argue."]
      ]},

    { g:"identities", k:"Derivation", t:"The quadratic formula",
      ask:"Everyone memorises it. It falls out of one geometric idea: completing the square.",
      steps:[
        ["ax² + bx + c = 0", "The general quadratic, a ≠ 0."],
        ["x² + " + F("b","a") + "x = −" + F("c","a"), "Divide by a and move the constant across."],
        ["x² + " + F("b","a") + "x + " + F("b²","4a²") + " = " + F("b²","4a²") + " − " + F("c","a"),
         "Add (b/2a)² to both sides — the piece that completes the square."],
        ["(x + " + F("b","2a") + ")² = " + F("b² − 4ac","4a²"),
         "The left side is now a perfect square. That was the whole trick."],
        ["x = " + F("−b ± √(b² − 4ac)","2a") + " <span class='qed'>∎</span>",
         "Take roots, isolate x. The discriminant decides how many are real."]
      ]},

    { g:"analysis", k:"Classic", t:"The Gaussian integral",
      ask:"∫e^(−x²) has no elementary antiderivative. So how is the area under it exactly √π?",
      steps:[
        ["I = ∫<sub>−∞</sub><sup>∞</sup> e<sup>−x²</sup> dx", "Name the thing you cannot integrate."],
        ["I² = (∫ e<sup>−x²</sup>dx)(∫ e<sup>−y²</sup>dy) = ∬ e<sup>−(x²+y²)</sup> dA",
         "Square it. One hard 1-D integral becomes one 2-D integral."],
        ["= ∫<sub>0</sub><sup>2π</sup>∫<sub>0</sub><sup>∞</sup> e<sup>−r²</sup> r dr dθ",
         "Polar coordinates. The Jacobian hands you an r — and that r is the gift."],
        ["= 2π · " + F("1","2") + " = π", "Now u = r² makes the inner integral elementary."],
        ["I = √π <span class='qed'>∎</span>",
         "Go up a dimension to come back down. This is why the normal distribution carries a 1/√(2π)."]
      ]},

    { g:"analysis", k:"First principles", t:"Why the derivative of sin is cos",
      ask:"Not a rule to memorise — it is one limit, and it only works in radians.",
      steps:[
        [F("d","dx") + " sin x = lim<sub>h→0</sub> " + F("sin(x+h) − sin x","h"),
         "The definition. No shortcuts yet."],
        ["= lim<sub>h→0</sub> " + F("sin x cos h + cos x sin h − sin x","h"),
         "Expand with the angle-addition identity."],
        ["= sin x · lim " + F("cos h − 1","h") + " + cos x · lim " + F("sin h","h"),
         "Group the two limits that don't depend on x."],
        ["lim<sub>h→0</sub> " + F("sin h","h") + " = 1, &nbsp; lim<sub>h→0</sub> " + F("cos h − 1","h") + " = 0",
         "Squeeze theorem. Both are false in degrees — this is what radians are for."],
        [F("d","dx") + " sin x = cos x <span class='qed'>∎</span>",
         "Substitute. The whole result rests on one squeeze."]
      ]},

    { g:"discrete", k:"Closed form", t:"Binet's formula",
      ask:"The Fibonacci numbers are integers. Their closed form is built entirely from √5.",
      steps:[
        ["F<sub>n</sub> = F<sub>n−1</sub> + F<sub>n−2</sub>", "The recurrence. Linear, so guess Fₙ = rⁿ."],
        ["r² = r + 1 &nbsp;⟹&nbsp; r = " + F("1 ± √5","2"),
         "Substituting and dividing by r^(n−2) gives a quadratic."],
        ["φ = " + F("1+√5","2") + ", &nbsp; ψ = " + F("1−√5","2"),
         "The golden ratio and its conjugate. Note φψ = −1 and φ + ψ = 1."],
        ["F<sub>n</sub> = Aφⁿ + Bψⁿ, &nbsp; F<sub>0</sub>=0, F<sub>1</sub>=1 ⟹ A = −B = " + F("1","√5"),
         "Any solution is a combination of the two; the seeds pin the constants."],
        ["F<sub>n</sub> = " + F("φⁿ − ψⁿ","√5") + " <span class='qed'>∎</span>",
         "|ψ| &lt; 1, so Fₙ is just φⁿ/√5 rounded. Irrationals cancel to integers, every time."]
      ]},

    { g:"discrete", k:"Inference", t:"Bayes' theorem",
      ask:"Two lines of algebra, and the reason a 99%-accurate test can still be wrong most of the time.",
      steps:[
        ["P(A ∩ B) = P(A|B)·P(B) = P(B|A)·P(A)",
         "One event, two ways to condition it. That is the entire proof."],
        ["P(A|B) = " + F("P(B|A)·P(A)","P(B)") + " <span class='qed'>∎</span>",
         "Divide by P(B). Done — the content is in how you read it."],
        ["P(B) = P(B|A)P(A) + P(B|¬A)P(¬A)",
         "Expand the denominator over every way B can happen."],
        ["1% base rate, 99% accurate ⟹ P(sick | +) ≈ 50%",
         "Ten thousand people: 99 true positives, 99 false positives. A coin flip."],
        ["The prior is doing the work.",
         "Rare things stay rare. Evidence updates a belief; it doesn't replace it."]
      ]},

    { g:"discrete", k:"Counting", t:"There is no largest prime",
      ask:"Euclid, roughly 300 BC. Still the cleanest argument anyone has written down.",
      steps:[
        ["Suppose p₁, p₂, …, p<sub>n</sub> are all the primes.",
         "Assume the opposite of what you want. Finitely many."],
        ["N = p₁p₂⋯p<sub>n</sub> + 1", "Multiply them all together and add one."],
        ["N mod p<sub>i</sub> = 1 for every i", "N leaves remainder 1 on division by each prime on the list."],
        ["So no p<sub>i</sub> divides N — yet N has a prime factor.",
         "Every integer &gt; 1 does. That factor is a prime not on the list."],
        ["Contradiction. The list can never be finished. <span class='qed'>∎</span>",
         "The assumption was the only thing that could break, so it breaks."]
      ]}
  ];

  /* ---------- menu ---------- */
  const stage = {
    kicker: document.getElementById("kicker"),
    title:  document.getElementById("title"),
    ask:    document.getElementById("ask"),
    steps:  document.getElementById("steps"),
    counter:document.getElementById("counter"),
  };
  const buttons = [];
  PROOFS.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "item";
    b.type = "button";
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span><span>${p.t}</span>`;
    b.addEventListener("click", () => show(i));
    document.getElementById("menu-" + p.g).appendChild(b);
    buttons.push(b);
  });

  let timers = [];
  function show(i) {
    timers.forEach(clearTimeout); timers = [];
    const p = PROOFS[i];
    buttons.forEach((b, j) => b.setAttribute("aria-current", String(j === i)));
    stage.kicker.textContent = p.k;
    stage.title.textContent  = p.t;
    stage.ask.innerHTML      = p.ask;
    stage.counter.textContent = `${String(i + 1).padStart(2, "0")} / ${String(PROOFS.length).padStart(2, "0")}`;
    stage.steps.innerHTML = "";
    p.steps.forEach(([math, why]) => {
      const li = document.createElement("li");
      li.className = "step";
      li.innerHTML = `<div class="math">${math}</div><div class="why">${why}</div>`;
      stage.steps.appendChild(li);
    });
    unravel();
    document.querySelector(".stage").scrollTop = 0;
  }
  function unravel() {
    const steps = [...stage.steps.children];
    steps.forEach(s => s.classList.remove("in"));
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    steps.forEach((s, k) => {
      if (reduced) { s.classList.add("in"); return; }
      timers.push(setTimeout(() => s.classList.add("in"), 240 + k * 420));
    });
  }
  document.getElementById("replay").addEventListener("click", unravel);
  show(0);

  /* ---------- cursor-reactive formula field ---------- */
  const cv = document.getElementById("field"), ctx = cv.getContext("2d");
  const GLYPHS = "∫∑∂∇√π∞λθφΦΨΩ≈≠≤≥±×÷⊕⊗∀∃∈∉⊂∪∩ℝℕℤℚ⇒⟺".split("");
  const SNIPPETS = [
    "e^{iπ}+1=0","∇·E = ρ/ε₀","∑1/n² = π²/6","a²+b²=c²","∫e^{-x²}dx=√π",
    "F(n)=F(n-1)+F(n-2)","O(n log n)","P(A|B)P(B)=P(B|A)P(A)","lim_{h→0} (f(x+h)-f(x))/h",
    "φ=(1+√5)/2","det(A-λI)=0","∮B·dl=μ₀I","x_{n+1}=x_n-f(x_n)/f'(x_n)",
    "Ax=λx","‖v‖²=⟨v,v⟩","∂u/∂t=α∇²u","n! ~ √(2πn)(n/e)ⁿ","2^{ℵ₀} > ℵ₀",
  ];
  let W = 0, H = 0, dpr = 1, glyphs = [], trail = [];
  const ptr = { x: -9999, y: -9999, has: false };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function seed() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const density = Math.round((W * H) / 20000);
    glyphs = [];
    for (let i = 0; i < density; i++) {
      const long = Math.random() < 0.22;
      glyphs.push({
        hx: Math.random() * W, hy: Math.random() * H, x: 0, y: 0, vx: 0, vy: 0,
        text: long ? SNIPPETS[(Math.random() * SNIPPETS.length) | 0]
                   : GLYPHS[(Math.random() * GLYPHS.length) | 0],
        size: long ? 11 + Math.random() * 3 : 13 + Math.random() * 14,
        base: long ? 0.055 + Math.random() * 0.05 : 0.05 + Math.random() * 0.07,
        ph: Math.random() * Math.PI * 2,
      });
      const g = glyphs[i]; g.x = g.hx; g.y = g.hy;
    }
  }

  addEventListener("resize", seed, { passive: true });
  addEventListener("pointermove", e => {
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.has = true;
    if (reduced) return;
    const last = trail[trail.length - 1];
    if (!last || Math.hypot(e.clientX - last.x, e.clientY - last.y) > 26) {
      trail.push({ x: e.clientX, y: e.clientY, t: performance.now(),
                   ch: GLYPHS[(Math.random() * GLYPHS.length) | 0],
                   rot: (Math.random() - 0.5) * 0.8 });
      if (trail.length > 26) trail.shift();
    }
  }, { passive: true });
  addEventListener("pointerleave", () => { ptr.has = false; ptr.x = ptr.y = -9999; });

  const R = 190;                       // influence radius
  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const g of glyphs) {
      const dx = g.x - ptr.x, dy = g.y - ptr.y;
      const d = Math.hypot(dx, dy);
      const near = ptr.has && d < R ? 1 - d / R : 0;

      // push away from the cursor, spring back home
      if (near > 0 && d > 0.001) {
        const push = near * near * 26;
        g.vx += (dx / d) * push * 0.045;
        g.vy += (dy / d) * push * 0.045;
      }
      g.vx += (g.hx - g.x) * 0.012; g.vy += (g.hy - g.y) * 0.012;
      g.vx *= 0.9; g.vy *= 0.9;
      g.x += g.vx; g.y += g.vy;

      const drift = reduced ? 0 : Math.sin(now / 2600 + g.ph) * 1.6;
      const alpha = g.base + near * near * 0.82;
      ctx.font = `${g.size}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      ctx.fillStyle = near > 0.42
        ? `rgba(127,178,255,${alpha})`
        : `rgba(232,234,240,${alpha})`;
      ctx.fillText(g.text, g.x, g.y + drift);
    }

    // the trail: symbols that follow the cursor and fade
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail[i], age = (now - p.t) / 1150;
      if (age >= 1) { trail.splice(i, 1); continue; }
      const a = (1 - age) * 0.6;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * age);
      ctx.font = `${13 + (1 - age) * 11}px ui-monospace, Menlo, monospace`;
      ctx.fillStyle = `rgba(245,199,106,${a})`;
      ctx.fillText(p.ch, 0, 0);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  seed();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
